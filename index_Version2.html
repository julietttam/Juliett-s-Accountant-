<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juliett's Finance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --card: #141414;
    --border: #ffffff10;
    --text: #f0f0f0;
    --muted: #ffffff50;
    --accent: #ffd700;
    --red: #e74c3c;
    --green: #7ed321;
    --orange: #f39c12;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }

  .header {
    background: linear-gradient(135deg, #1a1a1a 0%, #1a1200 100%);
    border-bottom: 1px solid var(--accent)30;
    padding: 20px 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--accent); text-shadow: 0 0 20px #ffd70060; }
  .subtitle { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .refresh-btn {
    background: none; border: 1px solid var(--accent)40; color: var(--accent);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 11px;
    font-family: 'DM Mono', monospace; transition: all 0.2s;
  }
  .refresh-btn:hover { background: var(--accent)15; }
  .refresh-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs { display: flex; }
  .tab-btn {
    padding: 10px 16px; cursor: pointer; font-size: 11px; font-family: 'DM Mono', monospace;
    background: none; border: none; color: var(--muted); border-bottom: 2px solid transparent;
    transition: all 0.2s; letter-spacing: 0.5px; white-space: nowrap;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .content { padding: 16px; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  .card-title {
    font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1.5px; margin-bottom: 12px;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
  }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .stat-value { font-size: 15px; font-weight: bold; }

  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .row-label { font-size: 12px; color: #ffffffcc; }
  .row-value { font-size: 12px; font-weight: bold; }

  .bar-wrap { width: 100%; height: 6px; background: #ffffff15; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }

  .month-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .month-pill {
    background: #ffffff10; color: var(--muted); border: none;
    border-radius: 6px; padding: 5px 12px; cursor: pointer;
    font-family: 'DM Mono', monospace; font-size: 11px; transition: all 0.2s;
  }
  .month-pill.active { background: var(--accent); color: #000; }

  .txn { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #ffffff08; }
  .txn-name { font-size: 12px; color: #ffffffcc; }
  .txn-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .txn-amount { font-size: 12px; font-weight: bold; text-align: right; }
  .txn-cat { font-size: 9px; color: var(--muted); }

  .arc-wrap { display: flex; flex-direction: column; align-items: center; }

  .savings-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #ffffff08; }
  .savings-month { font-size: 12px; color: #ffffffcc; }
  .savings-tag { font-size: 10px; color: var(--orange); margin-top: 2px; }
  .savings-bal { font-size: 13px; font-weight: bold; text-align: right; }
  .savings-saved { font-size: 9px; color: var(--muted); }

  .scene-wrap { border-radius: 10px; overflow: hidden; }
  .stage-dots { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
  .stage-dot { width: 8px; height: 8px; border-radius: 50%; background: #ffffff20; transition: background 0.3s; }
  .stage-item {
    display: flex; align-items: center; gap: 12px; padding: 10px;
    border-radius: 8px; margin-bottom: 6px; border: 1px solid transparent; transition: all 0.3s;
  }
  .stage-dot-sm { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .stage-name { font-size: 13px; font-family: 'Playfair Display', serif; }
  .stage-range { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .stage-you { font-size: 10px; }

  .alert { border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; font-size: 12px; }
  .alert-red { background: #2a0a0a; border: 1px solid var(--red); color: var(--red); }
  .alert-orange { background: #1a1000; border: 1px solid var(--orange); color: var(--orange); }

  .loading { text-align: center; padding: 60px 20px; color: var(--muted); }
  .loading-dot { display: inline-block; animation: pulse 1.4s ease-in-out infinite; }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  .error-box { background: #1a0808; border: 1px solid var(--red)60; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .error-title { color: var(--red); font-size: 12px; margin-bottom: 8px; }
  .error-url { font-size: 10px; color: var(--muted); word-break: break-all; margin-top: 8px; background: #0d0d0d; padding: 8px; border-radius: 6px; }

  .cat-row { margin-bottom: 12px; }
  .cat-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .cat-name { font-size: 12px; color: #ffffffcc; }
  .cat-amounts { font-size: 11px; }

  .total-row { border-top: 1px solid #ffffff15; margin-top: 12px; padding-top: 10px; display: flex; justify-content: space-between; }

  .outstanding-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }

  .scroll-x { overflow-x: auto; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="title">Juliett's Finance</div>
      <div class="subtitle" id="sync-status">loading...</div>
    </div>
    <button class="refresh-btn" id="refresh-btn" onclick="loadData()">↻ refresh</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="tab-btn" onclick="switchTab('spending')">Spending</button>
    <button class="tab-btn" onclick="switchTab('savings')">Savings</button>
    <button class="tab-btn" onclick="switchTab('life')">Life Stage</button>
  </div>
</div>

<div class="content" id="content"></div>

<script>
const GOAL = 200000;
const SAFETY = 80000;
const INCOME = 24000;

const CATEGORY_COLORS = {
  "🍽 Dining Out": "#e74c3c",
  "🛒 Groceries": "#27ae60",
  "🛍 Shopping": "#9b59b6",
  "💊 Health & Beauty": "#e91e8c",
  "🚌 Transport": "#3498db",
  "📱 Bills & Subs": "#1abc9c",
  "🎟 Entertainment": "#f39c12",
  "🏠 Rent": "#7f8c8d",
  "🏗 Home Setup": "#d35400",
  "· Other": "#95a5a6",
};

const MONTH_BUDGETS = {
  "🏠 Rent": 3000,
  "🍽 Dining Out": 2000,
  "🛒 Groceries": 1500,
  "🛍 Shopping": 1000,
  "💊 Health & Beauty": 700,
  "🚌 Transport": 500,
  "📱 Bills & Subs": 400,
  "🎟 Entertainment": 400,
  "🏗 Home Setup": 5000,
  "· Other": 500,
};

const LIFE_STAGES = [
  { id: "mansion", label: "Living the Dream", threshold: 0.9, accent: "#ffd700", caption: "✨ Mansion era, horse included ✨" },
  { id: "nice", label: "Comfortable Life", threshold: 0.65, accent: "#7ed321", caption: "🌿 Comfortable & thriving 🌿" },
  { id: "village", label: "Getting By", threshold: 0.35, accent: "#f39c12", caption: "🏚️ Making it work... barely 🏚️" },
  { id: "broke", label: "Uh Oh", threshold: 0, accent: "#e74c3c", caption: "💸 Cardboard box era. Please stop spending. 💸" },
];

let state = {
  tab: "dashboard",
  transactions: [],
  savingsRows: [],
  loading: true,
  error: null,
  selectedMonth: new Date().getFullYear() + "-" + String(new Date().getMonth() + 1).padStart(2, "0"),
  lastUpdated: null,
};

// CSV direct URL
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpBh9kuWUICSb0i47oUieMOGV-b5BuyKe4CvFGv2oj5marksaG7jD2YMlFJ1_Aow/pub?output=csv";

function parseCSV(text) {
  const lines = [];
  let inQuote = false, row = [], cell = "";
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') { inQuote = !inQuote; }
    else if (ch === ',' && !inQuote) { row.push(cell.trim()); cell = ""; }
    else if ((ch === '\n' || ch === '\r') && !inQuote) {
      if (cell || row.length) { row.push(cell.trim()); lines.push(row); }
      cell = ""; row = [];
      if (ch === '\r' && text[i+1] === '\n') i++;
    } else { cell += ch; }
  }
  if (cell || row.length) { row.push(cell.trim()); lines.push(row); }
  return lines;
}

async function fetchCSV() {
  // Try using a CORS proxy
  const proxies = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(CSV_URL)}`,
    `https://corsproxy.io/?${encodeURIComponent(CSV_URL)}`,
  ];

  for (const proxy of proxies) {
    try {
      console.log(`Trying proxy: ${proxy.substring(0, 50)}...`);
      const res = await fetch(proxy, { 
        cache: "no-store",
        headers: { 'User-Agent': 'Mozilla/5.0' }
      });
      
      if (res.ok) {
        const text = await res.text();
        console.log(`Fetched ${text.length} characters`);
        
        // Check if it's valid CSV (not error HTML)
        if (text.length > 100 && !text.includes("<!DOCTYPE") && !text.includes("<html")) {
          return parseCSV(text);
        }
      }
    } catch(e) { 
      console.log(`Proxy failed: ${e.message}`);
    }
  }
  
  throw new Error("Unable to fetch data. Try clicking refresh or check that your Google Sheet is published.");
}

function parseLog(rows) {
  let start = 0;
  for (let i = 0; i < rows.length; i++) {
    if (rows[i][0] === "Date") { start = i + 1; break; }
  }
  return rows.slice(start).filter(r => r[0] && /^\d{4}-\d{2}-\d{2}/.test(r[0])).map(r => ({
    date: r[0],
    vendor: r[1] || "",
    amount: parseFloat(r[2]) || 0,
    category: r[3] || "",
    method: r[4] || "",
    tag: r[5] || "",
    fronted: r[6] || "No",
    reimbursed: parseFloat(r[7]) || 0,
    netCost: parseFloat(r[8]) || 0,
  }));
}

function parseSavings(rows) {
  return rows.filter(r => r[0] && /^(January|February|March|April|May|June|July|August|September|October|November|December) 20\d\d/.test(r[0])).map(r => ({
    month: r[0],
    bigExpense: r[1] || "—",
    bigExpAmt: parseFloat(r[2]) || 0,
    saved: parseFloat(r[3]) || 0,
    balance: parseFloat(r[4]) || 0,
    status: r[5] || "",
  }));
}

async function loadData() {
  state.loading = true;
  state.error = null;
  document.getElementById("refresh-btn").textContent = "↻";
  document.getElementById("refresh-btn").style.animation = "spin 1s linear infinite";
  render();

  try {
    const allRows = await fetchCSV();
    
    // Split into two sheets based on headers
    let logStart = 0, savStart = 0;
    for (let i = 0; i < allRows.length; i++) {
      if (allRows[i][0] === "Date") logStart = i;
      if (allRows[i][0] && allRows[i][0].includes("January|February|March")) savStart = i;
    }
    
    const logRows = allRows.slice(logStart);
    const savRows = allRows.slice(savStart);
    
    state.transactions = parseLog(logRows);
    state.savingsRows = parseSavings(savRows);

    const months = [...new Set(state.transactions.map(t => t.date.substring(0,7)))].sort();
    if (months.length) state.selectedMonth = months[months.length - 1];

    state.lastUpdated = new Date().toLocaleTimeString("en-HK", { hour: "2-digit", minute: "2-digit" });
    state.loading = false;
  } catch(e) {
    console.error("Load error:", e);
    state.error = e.message;
    state.loading = false;
  }

  document.getElementById("refresh-btn").style.animation = "";
  document.getElementById("refresh-btn").textContent = "↻ refresh";
  render();
}

function getMonthTxns() {
  return state.transactions.filter(t => t.date.startsWith(state.selectedMonth));
}

function getSpendByCategory(txns) {
  const out = {};
  for (const t of txns) {
    out[t.category] = (out[t.category] || 0) + t.netCost;
  }
  return out;
}

function getCurrentBalance() {
  if (!state.savingsRows.length) return 120000;
  return state.savingsRows[state.savingsRows.length - 1].balance;
}

function getLifeStage(balance) {
  const pct = balance / GOAL;
  for (const s of LIFE_STAGES) {
    if (pct >= s.threshold) return s;
  }
  return LIFE_STAGES[LIFE_STAGES.length - 1];
}

function getMonths() {
  return [...new Set(state.transactions.map(t => t.date.substring(0,7)))].sort().reverse();
}

function sceneMansion() {
  return `<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0f0c29"/><stop offset="100%" stop-color="#302b63"/>
      </linearGradient>
    </defs>
    <rect width="320" height="220" fill="url(#sky1)"/>
    <circle cx="270" cy="35" r="18" fill="#ffeaa0" opacity="0.9"/>
    <rect x="70" y="80" width="180" height="85" fill="#2a2a4a"/>
    <polygon points="60,60 160,20 260,60" fill="#4a4a8a"/>
    <rect x="90" y="95" width="30" height="25" rx="2" fill="#ffd700" opacity="0.9"/>
    <ellipse cx="45" cy="150" rx="22" ry="12" fill="#8B4513"/>
    <text x="160" y="212" text-anchor="middle" fill="#ffd700" font-size="11" font-family="Georgia,serif" font-style="italic">✨ Mansion era, horse included ✨</text>
  </svg>`;
}

function sceneNice() {
  return `<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1a3a5c"/><stop offset="100%" stop-color="#2d6a8a"/>
      </linearGradient>
    </defs>
    <rect width="320" height="220" fill="url(#sky2)"/>
    <circle cx="60" cy="40" r="25" fill="#fff9c4" opacity="0.9"/>
    <rect x="0" y="158" width="320" height="62" fill="#2d5a3a"/>
    <rect x="90" y="90" width="140" height="75" fill="#4a6741"/>
    <polygon points="80,90 160,45 240,90" fill="#3a5535"/>
    <text x="160" y="212" text-anchor="middle" fill="#7ed321" font-size="11" font-family="Georgia,serif" font-style="italic">🌿 Comfortable &amp; thriving 🌿</text>
  </svg>`;
}

function sceneVillage() {
  return `<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4a4a2a"/><stop offset="100%" stop-color="#7a6a3a"/>
      </linearGradient>
    </defs>
    <rect width="320" height="220" fill="url(#sky3)"/>
    <rect x="0" y="155" width="320" height="65" fill="#5a4a2a"/>
    <rect x="100" y="100" width="120" height="60" fill="#8b7355"/>
    <text x="160" y="212" text-anchor="middle" fill="#f39c12" font-size="11" font-family="Georgia,serif" font-style="italic">🏚️ Making it work... barely 🏚️</text>
  </svg>`;
}

function sceneBroke() {
  return `<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <linearGradient id="sky4" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1a0a0a"/><stop offset="100%" stop-color="#3a1a1a"/>
      </linearGradient>
    </defs>
    <rect width="320" height="220" fill="url(#sky4)"/>
    <rect x="120" y="132" width="80" height="28" fill="#8b6914"/>
    <text x="160" y="212" text-anchor="middle" fill="#e74c3c" font-size="11" font-family="Georgia,serif" font-style="italic">💸 Cardboard box era. Please stop spending. 💸</text>
  </svg>`;
}

const SCENES = { mansion: sceneMansion, nice: sceneNice, village: sceneVillage, broke: sceneBroke };

function bar(pct, color, over) {
  const fill = over ? "var(--red)" : color;
  return `<div class="bar-wrap"><div class="bar-fill" style="width:${Math.min(pct,100)}%;background:${fill}"></div></div>`;
}

function fmt(n) { return Math.round(n).toLocaleString(); }

function renderDashboard() {
  const balance = getCurrentBalance();
  const stage = getLifeStage(balance);
  const txns = getMonthTxns();
  const bycat = getSpendByCategory(txns);
  const totalSpend = Object.values(bycat).reduce((a,b) => a+b, 0);
  const totalBudget = Object.values(MONTH_BUDGETS).reduce((a,b) => a+b, 0);
  const toGoal = Math.max(0, GOAL - balance);
  const remaining = Math.max(0, totalBudget - totalSpend);

  return `
    <div class="grid-2">
      <div class="stat-card">
        <div class="stat-label">Savings</div>
        <div class="stat-value" style="color:${balance < SAFETY ? 'var(--red)' : stage.accent}">HKD ${fmt(balance)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">This Month</div>
        <div class="stat-value" style="color:${totalSpend > INCOME ? 'var(--red)' : '#fff'}">HKD ${fmt(totalSpend)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Budget Left</div>
        <div class="stat-value" style="color:var(--green)">HKD ${fmt(remaining)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">To Goal</div>
        <div class="stat-value" style="color:${stage.accent}">HKD ${fmt(toGoal)}</div>
      </div>
    </div>
    ${balance < SAFETY ? `<div class="alert alert-red">🔴 SAFETY BUFFER BREACHED — below HKD ${fmt(SAFETY)}</div>` : ""}
  `;
}

function renderSpending() {
  const txns = getMonthTxns();
  const bycat = getSpendByCategory(txns);
  const totalSpend = Object.values(bycat).reduce((a,b) => a+b, 0);
  const totalBudget = Object.values(MONTH_BUDGETS).reduce((a,b) => a+b, 0);
  const months = getMonths();
  const balance = getCurrentBalance();
  const stage = getLifeStage(balance);

  const pills = months.map(m => `
    <button class="month-pill ${m === state.selectedMonth ? 'active' : ''}"
      onclick="selectMonth('${m}')" style="${m === state.selectedMonth ? `background:${stage.accent};color:#000` : ''}">${m}</button>
  `).join("");

  const cats = Object.entries(MONTH_BUDGETS).map(([cat, budget]) => {
    const spent = bycat[cat] || 0;
    const pct = budget > 0 ? (spent / budget) * 100 : 0;
    const over = spent > budget;
    if (spent === 0 && cat !== "🏠 Rent") return "";
    const color = CATEGORY_COLORS[cat] || "#888";
    return `
      <div class="cat-row">
        <div class="cat-header">
          <span class="cat-name">${cat}</span>
          <span class="cat-amounts" style="color:${over ? 'var(--red)' : 'var(--muted)'}">
            ${fmt(spent)} / ${fmt(budget)}
          </span>
        </div>
        ${bar(pct, color, over)}
      </div>`;
  }).join("");

  const recent = [...txns].reverse().slice(0, 25).map(t => {
    const color = CATEGORY_COLORS[t.category] || "#fff";
    return `
      <div class="txn">
        <div>
          <div class="txn-name">${t.vendor}</div>
          <div class="txn-meta">${t.date} · ${t.method}</div>
        </div>
        <div>
          <div class="txn-amount" style="color:${color}">HKD ${fmt(t.netCost)}</div>
          <div class="txn-cat">${t.category}</div>
        </div>
      </div>`;
  }).join("");

  return `
    <div class="card" style="padding:10px 14px">
      <div class="month-pills">${pills}</div>
    </div>
    <div class="card">
      <div class="card-title">By Category — ${state.selectedMonth}</div>
      ${cats || '<div style="color:var(--muted);font-size:12px">No data</div>'}
      <div class="total-row">
        <span style="font-size:12px;color:var(--muted)">TOTAL</span>
        <span style="font-size:13px;font-weight:bold;color:${totalSpend > totalBudget ? 'var(--red)' : 'var(--green)'}">
          HKD ${fmt(totalSpend)} / ${fmt(totalBudget)}
        </span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Recent Transactions</div>
      ${recent || '<div style="color:var(--muted);font-size:12px">No transactions</div>'}
    </div>`;
}

function renderSavings() {
  const balance = getCurrentBalance();
  const pct = Math.min(balance / GOAL, 1);
  const stage = getLifeStage(balance);

  const r = 70, cx = 100, cy = 100;
  const toRad = d => d * Math.PI / 180;
  const startDeg = -200, sweepDeg = 220;
  const arcPath = (start, end) => {
    const s = toRad(start), e = toRad(end);
    const x1 = cx + r*Math.cos(s), y1 = cy + r*Math.sin(s);
    const x2 = cx + r*Math.cos(e), y2 = cy + r*Math.sin(e);
    const large = end - start > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
  };
  const filledEnd = startDeg + sweepDeg * pct;

  const arcSvg = `
    <svg viewBox="0 0 200 175" style="width:180px;height:175px">
      <path d="${arcPath(startDeg, startDeg+sweepDeg)}" stroke="#ffffff15" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="${arcPath(startDeg, filledEnd)}" stroke="${stage.accent}" stroke-width="12" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 6px ${stage.accent})"/>
      <text x="${cx}" y="${cy-8}" text-anchor="middle" fill="#fff" font-size="22" font-family="Georgia,serif" font-weight="bold">${Math.round(pct*100)}%</text>
      <text x="${cx}" y="${cy+12}" text-anchor="middle" fill="#ffffff80" font-size="9" font-family="monospace">HKD ${fmt(balance)}</text>
      <text x="${cx}" y="${cy+26}" text-anchor="middle" fill="#ffffff50" font-size="8" font-family="monospace">of ${fmt(GOAL)} goal</text>
    </svg>`;

  const rows = state.savingsRows.map(row => {
    const bal = row.balance;
    const color = bal >= GOAL ? "#ffd700" : bal < SAFETY ? "var(--red)" : "var(--green)";
    return `
      <div class="savings-row">
        <div>
          <div class="savings-month">${row.month}</div>
          ${row.bigExpense && row.bigExpense !== "—" ? `<div class="savings-tag">${row.bigExpense}: HKD ${fmt(row.bigExpAmt)}</div>` : ""}
        </div>
        <div style="text-align:right">
          <div class="savings-bal" style="color:${color}">${fmt(bal)}</div>
          <div class="savings-saved">${row.saved >= 0 ? "+" : ""}${fmt(row.saved)}</div>
        </div>
      </div>`;
  }).join("");

  return `
    <div class="card arc-wrap">
      <div class="card-title" style="text-align:center">HKD 200k Goal Progress</div>
      ${arcSvg}
      <div style="font-size:12px;color:${stage.accent};margin-top:6px;font-family:'Playfair Display',serif">${stage.label}</div>
    </div>
    <div class="card">
      <div class="card-title">Month-by-Month</div>
      ${rows || '<div style="color:var(--muted);font-size:12px">No data</div>'}
    </div>`;
}

function renderLife() {
  const balance = getCurrentBalance();
  const stage = getLifeStage(balance);
  const sceneFn = SCENES[stage.id];

  const dots = LIFE_STAGES.map(s => `
    <div class="stage-dot" style="background:${s.id === stage.id ? s.accent : '#ffffff20'};${s.id === stage.id ? `box-shadow:0 0 8px ${s.accent}` : ''}"></div>
  `).join("");

  const stageList = LIFE_STAGES.map((s, i) => {
    const isActive = s.id === stage.id;
    const nextThresh = LIFE_STAGES[i-1]?.threshold || 1;
    return `
      <div class="stage-item" style="background:${isActive ? s.accent+'15' : 'transparent'};border-color:${isActive ? s.accent+'40' : 'transparent'}">
        <div class="stage-dot-sm" style="background:${isActive ? s.accent : '#ffffff20'};${isActive ? `box-shadow:0 0 8px ${s.accent}` : ''}"></div>
        <div style="flex:1">
          <div class="stage-name" style="color:${isActive ? s.accent : '#ffffff70'}">${s.label}</div>
          <div class="stage-range">${Math.round(s.threshold*100)}% – ${Math.round(nextThresh*100)}% of goal</div>
        </div>
        ${isActive ? `<div class="stage-you" style="color:${s.accent}">← you</div>` : ""}
      </div>`;
  }).join("");

  return `
    <div class="card" style="background:${stage.id === 'mansion' ? '#1a1a2e' : stage.id === 'nice' ? '#1a2a1a' : stage.id === 'village' ? '#2a2010' : '#1a0a0a'};border-color:${stage.accent}40">
      <div style="text-align:center;margin-bottom:10px">
        <div style="font-size:10px;color:${stage.accent};text-transform:uppercase;letter-spacing:2px">Current Life Stage</div>
        <div style="font-size:20px;color:${stage.accent};font-family:'Playfair Display',serif;margin-top:4px">${stage.label}</div>
      </div>
      <div class="scene-wrap">${sceneFn()}</div>
      <div class="stage-dots">${dots}</div>
    </div>
    <div class="card">
      <div class="card-title">The Stages of Juliett</div>
      ${stageList}
    </div>
  `;
}

function renderError() {
  return `
    <div class="error-box">
      <div class="error-title">⚠ Couldn't load data</div>
      <div style="font-size:11px;color:#ffffff80;line-height:1.6">${state.error}</div>
      <div style="font-size:11px;color:#ffffff60;margin-top:10px"><strong>📋 Troubleshooting:</strong></div>
      <div style="font-size:10px;color:#ffffff60;margin-top:6px">
        <strong>1️⃣ Google Sheet must be published:</strong><br/>
        Open your sheet → File → Publish to web → Click "Publish"<br/><br/>
        <strong>2️⃣ Try refreshing:</strong><br/>
        Click the ↻ refresh button above<br/><br/>
        <strong>3️⃣ Check browser console:</strong><br/>
        Press F12 → Console → look for error details
      </div>
    </div>`;
}

function render() {
  const statusEl = document.getElementById("sync-status");
  if (statusEl) {
    statusEl.textContent = state.loading
      ? "loading..."
      : state.lastUpdated
        ? `↻ synced ${state.lastUpdated}`
        : "not loaded";
  }

  const content = document.getElementById("content");
  if (!content) return;

  if (state.loading) {
    content.innerHTML = `<div class="loading">
      <span class="loading-dot">●</span>
      <span class="loading-dot">●</span>
      <span class="loading-dot">●</span>
      <div style="margin-top:14px;font-size:11px">fetching your finances...</div>
    </div>`;
    return;
  }

  if (state.error) {
    content.innerHTML = renderError();
    return;
  }

  switch(state.tab) {
    case "dashboard": content.innerHTML = renderDashboard(); break;
    case "spending":  content.innerHTML = renderSpending();  break;
    case "savings":   content.innerHTML = renderSavings();   break;
    case "life":      content.innerHTML = renderLife();      break;
  }
}

function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tab-btn").forEach((btn, i) => {
    btn.classList.toggle("active", ["dashboard","spending","savings","life"][i] === tab);
  });
  render();
}

function selectMonth(m) {
  state.selectedMonth = m;
  render();
}

loadData();
</script>
</body>
</html>
